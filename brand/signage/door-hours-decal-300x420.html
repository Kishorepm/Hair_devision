<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Hair Division — door opening-hours decal, 300 × 420 mm</title>
<link rel="stylesheet" href="print.css">
<style>
  @page{size:300mm 420mm;margin:0}
  .page{--w:300mm;--h:420mm;background:#2b2e2a;color:#fff;padding:34mm 36mm}
  .mono{height:70mm;margin:0 auto 17mm}
  h1{font-size:6.2mm;text-align:center;letter-spacing:.42em;margin-right:-.42em}
  .device{color:#fff;margin:10mm 0 17mm;--dl:34mm;--dd:2mm;--dw:.4mm}
  dl{display:grid;grid-template-columns:1fr auto;row-gap:12.5mm;column-gap:8mm;align-items:baseline}
  dt{font-family:var(--serif);font-weight:500;font-size:13.5mm;line-height:1}
  dd{font-family:var(--sans);font-weight:400;font-size:8.4mm;letter-spacing:.06em;text-align:right;white-space:nowrap}
  .foot{position:absolute;left:0;right:0;bottom:36mm;text-align:center}
  .foot .device{margin:0 0 13mm}
  .foot p{font-size:5.2mm;letter-spacing:.3em;margin-right:-.3em}
  .foot .tel{font-family:var(--serif);font-weight:500;font-size:19mm;letter-spacing:.02em;margin:0 0 6mm}
</style></head>
<body>
<!-- Door / window hours decal. Everything here is white: cut from matte white vinyl and
     applied inside the glass (reverse-cut) at eye level, about 1500 mm to the centre.
     The grey background is only a proof colour standing in for the glass.
     DRAFT HOURS — confirm with Raine before cutting. -->
<section class="page">
  <img class="mono" src="../logo/svg/hair-division-monogram-white.svg" alt="HD">
  <h1 class="label">Opening hours</h1>
  <div class="device"><i></i></div>
  <dl>
    <dt>Tuesday – Friday</dt><dd>9:15 – 5:30</dd>
    <dt>Thursday late</dt><dd>until 7:00</dd>
    <dt>Saturday</dt><dd>9:00 – 4:00</dd>
    <dt>Sunday &amp; Monday</dt><dd>Closed</dd>
  </dl>
  <div class="foot">
    <div class="device"><i></i></div>
    <p class="tel">09 488 9295</p>
    <p class="label">hairdivision.co.nz</p>
  </div>
</section>
</body></html>
